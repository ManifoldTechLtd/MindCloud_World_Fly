[package]
name = "mindcloud-fly-bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bevy for 3D mesh rendering, UI, window management
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "multi_threaded",
    "std",
    "x11",
] }

# web-splat for high-performance Gaussian Splatting (58 FPS validated)
web_splats = { path = "../native/web-splat" }

# Camera control
bevy_panorbit_camera = "0.34"

# Utilities
clap = { version = "4.6", features = ["derive"] }
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
cgmath = { version = "0.18.0", features = ["bytemuck"], git = "https://github.com/rustgd/cgmath" }
wgpu = "27.0"

# Fast dev builds: optimize deps but not our code
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
