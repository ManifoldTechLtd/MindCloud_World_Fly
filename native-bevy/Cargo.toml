[package]
name = "mindcloud-fly-bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bevy for 3D mesh rendering, UI, window management
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_winit",
    # Loads glTF animation clips (drone2.glb's propeller spin) + pulls in bevy_animation.
    "gltf_animation",
    "multi_threaded",
    "png",
    # JPEG textures inside glTF models — without this bevy_image can't decode them and a model
    # whose textures are JPEG fails to load entirely (not just the texture).
    "jpeg",
    # Auto-registers every #[derive(Reflect)] component into the type registry at startup. glTF
    # scenes are spawned by reflection-cloning their entities, so without this scene spawn panics on
    # the first unregistered type (Transform, Visibility, Mesh3d, ...). A Bevy default we lost above.
    "reflect_auto_register",
    "std",
    "vorbis",
    "wav",
    "x11",
] }

# web-splat for high-performance Gaussian Splatting (58 FPS validated).
# VENDORED internally (native-bevy/web-splat) so this project is fully self-contained and does
# NOT depend on the native/ folder. Modify the copy here freely; native/web-splat is untouched.
web_splats = { path = "web-splat" }

# egui integration for menus / HUD / settings (reuses native's mature egui UI code).
# 0.39.x targets Bevy 0.18 (0.40.0-rc.1 targets Bevy 0.19-rc → pulls a 2nd bevy, trait mismatch).
bevy_egui = "0.39"

# HID RC-transmitter input (same version as native/)
hidapi = "2.6"

# Utilities
clap = { version = "4.6", features = ["derive"] }
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cgmath = { version = "0.18.0", features = ["bytemuck"], git = "https://github.com/rustgd/cgmath" }
wgpu = "27.0"

# Fast dev builds: optimize deps but not our code
[profile.dev.package."*"]
opt-level = 3

# Our crate at opt-level=1 (deps stay opt-3 above). Keep this >= 1: at opt-level=0 the collision-octree
# build (crate::collision, run on the PLY-load thread over millions of points) is unoptimized and makes
# scene loading take ~1.5 min. opt-1 restores normal load times. (An earlier opt-1 codegen SIGSEGV was
# actually a since-removed observer's pathological monomorphization, NOT opt-1 itself — HEAD built fine
# at opt-1.) Could go to 2/3 for a bit more speed, but opt-1 is the proven-stable level on this toolchain.
[profile.dev]
opt-level = 1
