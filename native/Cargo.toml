[package]
name = "mindcloud-fly"
version = "0.1.0"
edition = "2021"
authors = ["Manifold Tech Ltd."]
description = "MindCloud World Fly — native split-screen FPV drone racing simulator"

[dependencies]
# GSplat rendering (GPU radix sort, PLY loading, SH evaluation)
web_splats = { path = "web-splat" }

# Core
wgpu = "29.0.1"
winit = "0.30.12"
pollster = { version = "0.4.0", features = ["macro"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }

# Math
cgmath = { version = "0.18.0", features = ["bytemuck"], git = "https://github.com/rustgd/cgmath" }

# UI
egui = "0.34.0"
egui-wgpu = "0.34.0"
egui-winit = { version = "0.34.0", default-features = false }

# Input
hidapi = "2.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Misc
clap = { version = "4.6", features = ["derive"] }
